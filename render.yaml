services:
  - type: web
    name: nebu-bot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DISCORD_TOKEN
        sync: false
      - key: DEVELOPER_USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nebu_bot
      - key: CLOUDINARY_URL
        sync: false
      - key: INVITE_MAX_AGE_SECONDS
        value: "900"
      - key: URL_PING
        sync: false
